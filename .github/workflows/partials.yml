name: Partials

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.MAINT_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      flagged: ${{ steps.check.outputs.flagged }}
      changed: ${{ steps.check.outputs.changed }}
      claude: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: modm-io/modm
          ref: develop
          path: modm
      - id: check
        run: |
          python3 scripts/check_partials.py modm
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md

  review:
    needs: check
    if: needs.check.outputs.claude == 'true' && (needs.check.outputs.flagged == 'true' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.MAINT_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 40
            --allowedTools "Read,Write,Bash(gh api:*),Bash(gh run view:*),Bash(gh run list:*)"
          prompt: |
            report.md lists the modm-ext/*-partial repositories that modm-io/modm uses as submodules.
            Each partial repo copies a subset of an upstream project with a weekly Update workflow
            (.github/workflows/update.yml, using modm-ext/partial's partial.py with glob patterns).
            ❌ entries have problems, 🔄 entries have new commits since the commit modm pins.

            For every ❌ and 🔄 repo, use `gh api` and `gh run view --log-failed` to find out:
            - why a failed or missing Update run failed (read the workflow file and the log),
            - whether the new commits still make sense: upstream sometimes moves or renames files,
              then the glob patterns silently copy nothing or only half. Compare the changed file
              list with the patterns in update.yml and with the upstream release notes.
            Do not change anything. Write review.md: one section per repo, a verdict
            (fine / needs attention) and, for problems, the concrete fix.
      - if: always()
        run: |
          [ -f review.md ] && cat review.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review
          path: review.md
          if-no-files-found: ignore

  bump:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      branch: ${{ steps.bump.outputs.branch }}
      image_cortex: ${{ steps.bump.outputs.image_cortex }}
      image_avr: ${{ steps.bump.outputs.image_avr }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: modm-io/modm
          ref: develop
          submodules: recursive
          persist-credentials: false  # else the push uses GITHUB_TOKEN, not MAINT_TOKEN
      - uses: actions/checkout@v4
        with:
          path: .maintenance
          persist-credentials: false
      - id: bump
        run: |
          git config user.name "modm maintenance"
          git config user.email "bot@modm.io"
          base=$(git rev-parse HEAD)
          .maintenance/scripts/bump.sh | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(git rev-parse HEAD)" != "$base" ] || exit 0
          branch="maintenance/partials-$(date +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/salkinium/modm.git" "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "image_cortex=$(grep -om1 'ghcr.io/modm-ext/modm-build-cortex-m:[0-9-]*' .github/workflows/linux.yml)" >> "$GITHUB_OUTPUT"
          echo "image_avr=$(grep -om1 'ghcr.io/modm-ext/modm-build-avr:[0-9-]*' .github/workflows/linux.yml)" >> "$GITHUB_OUTPUT"

  # Same as hal-compile-quick(-avr) and (avr|cortex-m)-examples in modm's linux.yml
  compile:
    needs: bump
    if: needs.bump.outputs.branch != ''
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.bump.outputs.image_cortex }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: salkinium/modm
          ref: ${{ needs.bump.outputs.branch }}
          submodules: recursive
      - run: |
          git config --global --add safe.directory '*'
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
          cd test/all && python3 run_all.py stm32 sam rp nrf --quick --split 7 --part ${{ matrix.part }}
      # the ext modules are mostly used by examples only (nanopb, lvgl, tinyusb, ...)
      - if: always()
        run: |
          cd examples && ../tools/scripts/examples_compile.py . ../test/integration --target '^(stm32|sam|rp|nrf)' --split 7 --part ${{ matrix.part }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.part }}
          path: test/all/log

  compile-avr:
    needs: bump
    if: needs.bump.outputs.branch != ''
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.bump.outputs.image_avr }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: salkinium/modm
          ref: ${{ needs.bump.outputs.branch }}
          submodules: recursive
      - run: |
          git config --global --add safe.directory '*'
          pip3 install --upgrade --upgrade-strategy=eager --break-system-packages modm
          cd test/all && python3 run_all.py at --quick
      - if: always()
        run: |
          cd examples && ../tools/scripts/examples_compile.py . ../test/integration --target '^at'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-avr
          path: test/all/log

  fix:
    needs: [check, bump, compile, compile-avr]
    if: always() && needs.check.outputs.claude == 'true' && needs.bump.result == 'success' && (needs.compile.result == 'failure' || needs.compile-avr.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE_CORTEX: ${{ needs.bump.outputs.image_cortex }}
      IMAGE_AVR: ${{ needs.bump.outputs.image_avr }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: salkinium/modm
          ref: ${{ needs.bump.outputs.branch }}
          submodules: recursive
          token: ${{ secrets.MAINT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .maintenance
      - uses: actions/download-artifact@v4
        with:
          pattern: compile-*
          path: .logs
      - run: |
          git config user.name "modm maintenance"
          git config user.email "bot@modm.io"
          docker pull -q "$IMAGE_CORTEX" && docker pull -q "$IMAGE_AVR"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.MAINT_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5 --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(.maintenance/scripts/compile.sh:*),Bash(ls:*),Bash(grep:*)"
          prompt: |
            This is modm with its ext/ partial submodules bumped to their latest version (HEAD commit).
            The quick HAL compile (test/all/run_all.py --quick) or the examples compile (tools/scripts/examples_compile.py) failed afterwards; logs are in .logs/.
            Fix modm so it compiles again with the new submodule versions. Change only modm's own
            files (module.lb/module.md/.cpp.in/.hpp.in etc. under ext/ and src/), never the
            submodule contents. Verify with `.maintenance/scripts/compile.sh <targets>`, for example
            `.maintenance/scripts/compile.sh stm32f4 stm32g0` or `... at` for AVR, with only the
            failing families. Commit each fix with a message like "[ext] Fix X for Y v1.2".
            Do not push. Finish with a short summary of what broke, what you changed and what is
            still failing in fix.md.
      - if: always()
        run: |
          git push origin HEAD || true
          [ -f fix.md ] && cat fix.md >> "$GITHUB_STEP_SUMMARY" || true

  # Red run = GitHub sends a mail, so problems do not go unnoticed
  result:
    needs: [check, review, bump, compile, compile-avr, fix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "branch: ${{ needs.bump.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.check.result }}" = success ] || exit 1
          [ "${{ needs.check.outputs.flagged }}" != true ] || { echo "partial repos flagged, see review"; exit 1; }
          [ "${{ needs.compile.result }}" != failure ] && [ "${{ needs.compile-avr.result }}" != failure ] \
            || { echo "compile failed, see fix"; exit 1; }
